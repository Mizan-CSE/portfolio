    <script>
      (function (location) {
        if (!location.search.startsWith("?/")) {
          return;
        }

        const decoded = location.search.slice(2).replace(/~and~/g, "&");
        const [path, query = ""] = decoded.split("&");
        const nextUrl = `${location.pathname}${path}${query ? `?${query}` : ""}${location.hash}`;

        window.history.replaceState(null, "", nextUrl);
      })(window.location);
    </script>
